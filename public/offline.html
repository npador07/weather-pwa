<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Offline - Weather App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #1e1e2f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }
    .container {
      padding: 20px;
    }
    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }
    p {
      font-size: 1rem;
      margin-bottom: 1rem;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      background: #4da6ff;
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }
    button:hover {
      background: #3399ff;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌤 Weather App</h1>
    <p>You are currently offline.</p>
    <p>Try refreshing when you have an internet connection.</p>
    <button onclick="location.reload()">Retry</button>
  </div>
</body>
</html>
